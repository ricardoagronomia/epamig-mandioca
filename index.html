<head>
  <meta charset="UTF-8" />
  <title>MandiocaTrack - Pesquisa de Campo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .main-container {
      margin-top: 0;
    }

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    :root {
      --green-dark: #064e3b;
      --green: #166534;
      --green-soft: #dcfce7;
      --gold: #fbbf24;
      --gold-soft: #fef3c7;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-800: #1f2933;
    }

    #authScreen, #appScreen { display: none; }

    .auth-container {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
    }
    .logo-wrap { text-align: center; margin-bottom: 20px; }
    .logo-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      border-radius: 24px;
      background: radial-gradient(circle at 30% 20%, #bbf7d0 0, #16a34a 35%, #022c22 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(6, 78, 59, 0.5);
      overflow: hidden;
    }
    .logo-icon img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      display: block;
    }
    .logo-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--green-dark);
      letter-spacing: 0.03em;
    }
    .logo-subtitle {
      font-size: 14px;
      color: var(--gray-600);
    }

    .tabs {
      display: flex;
      margin: 24px 0 16px;
      border-radius: 999px;
      background: var(--gray-100);
      padding: 4px;
    }
    .tabs button {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--gray-600);
      transition: all 0.15s ease;
    }
    .tabs button.active {
      background: var(--green);
      color: #fff;
      box-shadow: 0 2px 8px rgba(22, 101, 52, 0.4);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-800);
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 9px 11px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid var(--gray-200);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
    }
    input:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(22, 101, 52, 0.2);
    }

    .btn-primary {
      width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(22, 101, 52, 0.5);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(22, 101, 52, 0.55);
      background: linear-gradient(135deg, #15803d 0%, #022c22 100%);
    }

    .auth-message {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
    }
    .auth-message.success {
      background: var(--green-soft);
      color: #065f46;
      border: 1px solid #6ee7b7;
    }
    .auth-message.error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .app-layout { display: flex; flex-direction: column; height: 100vh; }

    .header {
      background: linear-gradient(135deg, #022c22 0%, var(--green-dark) 50%, var(--green) 100%);
      color: #f9fafb;
      padding: 6px 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.3);
      z-index: 10;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(15, 118, 110, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .header-icon img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      display: block;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .header-subtitle {
      font-size: 12px;
      color: #d1fae5;
    }
    .header-right { text-align: right; }
    .header-user {
      font-size: 13px;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    .btn-outline {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(209, 213, 219, 0.6);
      background: transparent;
      color: #f9fafb;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-outline:hover { background: rgba(15, 23, 42, 0.4); }

    .main-container {
      flex: 1;
      display: flex;
      min-height: 0;
      background: #f3f4f6;
    }

    .sidebar {
      width: 240px;
      background: #020617;
      color: #e5e7eb;
      padding-top: 12px;
      border-right: 1px solid rgba(148, 163, 184, 0.25);
      display: flex;
      flex-direction: column;
    }
    .sidebar-section {
      padding: 10px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }
    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      padding: 4px 18px 8px;
    }
    .sidebar-item {
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #cbd5f5;
      cursor: pointer;
      transition: background 0.14s, color 0.14s;
    }
    .sidebar-item svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      opacity: 0.9;
    }
    .sidebar-item:hover { background: rgba(15, 23, 42, 0.9); }
    .sidebar-item.active {
      background: linear-gradient(90deg, var(--green-dark), var(--green));
      color: #fefce8;
      font-weight: 600;
    }
    .sidebar-item.disabled { opacity: 0.45; cursor: default; }

    .content-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .content-header {
      margin-top: 24px;
      margin-bottom: 10px;
    }

    .content-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--green-dark);
    }
    .content-subtitle {
      font-size: 14px;
      color: var(--gray-600);
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px 20px;
      border: 1px solid var(--gray-200);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.04);
      margin-bottom: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--gray-200);
    }
    th {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gray-600);
      background: var(--gray-50);
    }
    tr:last-child td { border-bottom: none; }
