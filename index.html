<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>MandiocaTrack - Gestão de Pesquisa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Reset básico e ajustes de header -->
  <style>
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .main-container {
      margin-top: 0;
    }

    /* Se o header for fixo e estiver cobrindo o conteúdo, descomente: */
    /*
    main, #appContainer, #appRoot {
      padding-top: 60px;  // ajuste 60px para a altura real do cabeçalho
    }
    */
  </style>

  <!-- Estilos gerais da aplicação -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    :root {
      --green-dark: #064e3b;
      --green: #166534;
      --green-soft: #dcfce7;
      --gold: #fbbf24;
      --gold-soft: #fef3c7;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-800: #1f2933;
    }

    #authScreen, #appScreen { display: none; }

    .auth-container {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
    }
    .logo-wrap { text-align: center; margin-bottom: 20px; }
    .logo-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      border-radius: 24px;
      background: radial-gradient(circle at 30% 20%, #bbf7d0 0, #16a34a 35%, #022c22 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(6, 78, 59, 0.5);
      overflow: hidden;
    }
    .logo-icon img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      display: block;
    }
    .logo-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--green-dark);
      letter-spacing: 0.03em;
    }
    .logo-subtitle {
      font-size: 14px;
      color: var(--gray-600);
    }

    .tabs {
      display: flex;
      margin: 24px 0 16px;
      border-radius: 999px;
      background: var(--gray-100);
      padding: 4px;
    }
    .tabs button {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--gray-600);
      transition: all 0.15s ease;
    }
    .tabs button.active {
      background: var(--green);
      color: #fff;
      box-shadow: 0 2px 8px rgba(22, 101, 52, 0.4);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-800);
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 9px 11px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid var(--gray-200);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
    }
    input:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(22, 101, 52, 0.2);
    }

    .btn-primary {
      width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(22, 101, 52, 0.5);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(22, 101, 52, 0.55);
      background: linear-gradient(135deg, #15803d 0%, #022c22 100%);
    }

    .auth-message {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
    }
    .auth-message.success {
      background: var(--green-soft);
      color: #065f46;
      border: 1px solid #6ee7b7;
    }
    .auth-message.error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .app-layout { display: flex; flex-direction: column; height: 100vh; }

    .header {
      background: linear-gradient(135deg, #022c22 0%, var(--green-dark) 50%, var(--green) 100%);
      color: #f9fafb;
      padding: 6px 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.3);
      z-index: 10;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(15, 118, 110, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .header-icon img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      display: block;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .header-subtitle {
      font-size: 12px;
      color: #d1fae5;
    }
    .header-right { text-align: right; }
    .header-user {
      font-size: 13px;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    .btn-outline {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(209, 213, 219, 0.6);
      background: transparent;
      color: #f9fafb;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-outline:hover { background: rgba(15, 23, 42, 0.4); }

    .main-container {
      flex: 1;
      display: flex;
      min-height: 0;
      background: #f3f4f6;
    }

    .sidebar {
      width: 240px;
      background: #020617;
      color: #e5e7eb;
      padding-top: 12px;
      border-right: 1px solid rgba(148, 163, 184, 0.25);
      display: flex;
      flex-direction: column;
    }
    .sidebar-section {
      padding: 10px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }
    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      padding: 4px 18px 8px;
    }
    .sidebar-item {
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #cbd5f5;
      cursor: pointer;
      transition: background 0.14s, color 0.14s;
    }
    .sidebar-item svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      opacity: 0.9;
    }
    .sidebar-item:hover { background: rgba(15, 23, 42, 0.9); }
    .sidebar-item.active {
      background: linear-gradient(90deg, var(--green-dark), var(--green));
      color: #fefce8;
      font-weight: 600;
    }
    .sidebar-item.disabled { opacity: 0.45; cursor: default; }

    .content-area {
      flex: 1;
      adding: 16px;       /* estava 20px */
      overflow-y: auto;
    }
    .content-header {
      margin-top: 12px;
      margin-bottom: 10px;
    }

    .content-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--green-dark);
    }
    .content-subtitle {
      font-size: 14px;
      color: var(--gray-600);
    }

        .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px 20px;
      border: 1px solid var(--gray-200);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.04);
      margin-bottom: 16px;
    }

    /* === Mapa DBC: grade 3×4 === */
    .dbc-block-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .dbc-plot-cell {
      border-radius: 10px;
      padding: 6px 8px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 12px;
      color: #111827;
      border: 1px solid rgba(148,163,184,0.6);
      background: #f9fafb;
    }

    .dbc-plot-label-main {
      font-weight: 600;
      font-size: 12px;
    }

    .dbc-plot-label-sub {
      font-size: 11px;
      color: #374151;
    }

    /* Ajuste só para telas pequenas: permite rolar horizontal */
    @media (max-width: 640px) {
      .card {
        overflow-x: auto;
        padding: 18px 14px;
      }

      .dbc-block-grid {
        min-width: 480px;
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--gray-200);
    }
    th {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gray-600);
      background: var(--gray-50);
    }
    tr:last-child td { border-bottom: none; }

    .tag-role {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-role.admin { background: rgba(22,101,52,0.16); color: var(--green-dark); }
    .tag-role.collaborator { background: rgba(251,191,36,0.16); color: #92400e; }
    .tag-role.visitor { background: rgba(156,163,175,0.16); color: #374151; }

    .btn-secondary {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--gray-300);
      background: var(--gray-50);
      color: var(--gray-800);
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #fca5a5;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-link {
      border: none;
      background: none;
      color: var(--green);
      font-size: 13px;
      cursor: pointer;
      padding: 0;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal.active { display: flex; }
    .modal-content {
      max-width: 720px;
      max-height: 90vh;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.4);
      overflow-y: auto;
    }

    /* Cronograma de experimentos */
    .sched-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .sched-row.sched-done {
      background-color: #dcfce7;
    }

    .sched-row.sched-late {
      background-color: #fee2e2;
    }

    .sched-status-btn {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid #9ca3af;
      background: white;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }

    .sched-row span {
      flex: 1 1 auto;
      min-width: 160px;
    }

    .sched-row input[type="date"] {
      flex: 0 0 120px;
    }

    .sched-row .btn-danger {
      padding: 2px 6px;
    }

    /* Deixar o botão principal largo no mobile */
    @media (max-width: 640px) {
      .modal-content .btn-primary {
        width: 100%;
        justify-content: center;
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--green-dark);
    }
    .modal-close {
      border: none;
      background: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--gray-400);
    }

/* barra lateral vira carrossel horizontal + ajuste de header no mobile */
@media (max-width: 768px) {
  .main-container {
    display: block;        /* evita conflitos de flex aqui */
  }

  .sidebar {
    position: fixed;
    top: 65px;
    left: 0;
    width: 100%;
    height: 48px;
    display: flex;
    flex-direction: row;
    overflow-x: auto;      /* rolagem horizontal */
    overflow-y: hidden;
    border-right: none;
    border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    padding-inline: 4px;
    padding-top: 0;
    padding-bottom: 0;
    box-sizing: border-box;
  }

  .sidebar-section {
    display: flex;
    border-bottom: none;
  }

  .sidebar-section-title {
    display: none;
  }

  .sidebar-item {
    padding: 10px 12px;
    white-space: nowrap;
    flex: 0 0 auto;        /* cada item ocupa só o que precisa */
    align-items: center;   /* garante alinhamento vertical igual */
  }

  .content-area {
    padding: 16px;
    margin-top: 120px;
  }
}

  /* cabeçalho: info à esquerda, botão sair à direita */
  .header-content {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .header-user {
    font-size: 12px;
    max-width: 160px;
    white-space: normal;
    word-break: break-word;
  }

  .btn-outline {
    padding: 4px 10px;
    font-size: 12px;
    align-self: flex-end;
    width: auto;
    text-align: center;
  }
}

  .sidebar-section { border-bottom: none; }
  .sidebar-section-title { display: none; }

  .sidebar-item {
    padding: 10px 14px;
    white-space: nowrap;
    flex: 0 0 auto;         /* cada item só ocupa o próprio tamanho */
  }

  .content-area {
    padding: 16px;
    margin-top: 120px;
  }
}

    /* === Mapa DBC: grade 3×4 === */
    .dbc-block-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .dbc-plot-cell {
      border-radius: 10px;
      padding: 6px 8px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 12px;
      color: #111827;
      border: 1px solid rgba(148,163,184,0.6);
      background: #f9fafb;
    }

    .dbc-plot-label-main {
      font-weight: 600;
      font-size: 12px;
    }

    .dbc-plot-label-sub {
      font-size: 11px;
      color: #374151;
    }
  </style>

  <!-- Estilos específicos de impressão das etiquetas -->
  <style>
    /* Layout de impressão das etiquetas */
   @media print {
  @page {
    size: A4;
    margin: 0mm 0mm;
  }

  body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    background: #ffffff;
  }

  /* Esconde interface do app */
  .header,
  .sidebar,
  .content-header,
  #authScreen,
  #modalRoot,
  button,
  select,
  label {
    display: none !important;
  }

  /* Área de etiquetas */
  #dbcTabQrArea,
  #qrLabelsWrapper,
  .qr-label-sheet,
  .qr-label-card,
  .qr-label-single-page {
    display: block;
  }

  .qr-label-sheet {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 70mm;
    gap: 0mm;
    page-break-inside: avoid;
  }

  /* aqui tiramos borda e sombra */
  .qr-label-card,
  .qr-label-single-page {
    width: 100mm;
    height: 70mm;
    border: none !important;
    box-shadow: none !important;
    background: #ffffff !important;
    padding: 4mm;
    box-sizing: border-box;
    page-break-inside: avoid;
  }
}

  </style>
</head>
<body>
  <!-- AUTH -->
  <div id="authScreen">
    <div class="auth-container">
      <div class="logo-wrap">
        <div class="logo-icon">
          <img src="logo-mandioca.png" alt="MandiocaTrack">
        </div>
        <div class="logo-title">MandiocaTrack</div>
        <div class="logo-subtitle">Gestão de Pesquisa</div>
      </div>
      <div class="tabs">
        <button id="tabLogin" class="active">Entrar</button>
        <button id="tabSignup">Cadastrar</button>
      </div>
      <div id="loginForm">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" placeholder="Sua senha">
        <button id="btnLogin" class="btn-primary">Entrar</button>
      </div>
      <div id="signupForm" style="display:none;">
        <label for="signupEmail">E-mail</label>
        <input type="email" id="signupEmail" placeholder="seu@email">
        <label for="signupPassword">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="signupPassword" placeholder="Crie uma senha">
        <button id="btnSignup" class="btn-primary">Criar Conta</button>
      </div>
      <div id="authMessage" class="auth-message"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="app-layout">
    <div class="header">
      <div class="header-content">
        <div class="header-left">
          <div class="header-icon">
            <img src="logo-mandioca.png" alt="MandiocaTrack">
          </div>
          <div>
            <div class="header-title">MandiocaTrack</div>
            <div class="header-subtitle">Gestão de Pesquisa</div>
          </div>
        </div>
        <div class="header-right">
          <div id="userEmail" class="header-user"></div>
          <button id="btnLogout" class="btn-outline">Sair</button>
        </div>
      </div>
    </div>

    <div class="main-container">
  <aside class="sidebar">
  <!-- Seção principal -->
  <div class="sidebar-section">
    <div class="sidebar-section-title">Principal</div>

    <!-- 1) Experimentos (primeiro item) -->
    <div class="sidebar-item disabled" data-page="experiments">
      <svg viewBox="0 0 24 24">
        <path d="M9 2v2H5v2h4v6.586l-2.293 2.293A1 1 0 0 0 7 16h10a1 1 0 0 0 .707-1.707L15 12.586V6h4V4h-4V2H9zm2 4h2v7a1 1 0 0 0 .293.707L14.586 15H9.414l1.293-1.293A1 1 0 0 0 11 13V6z"/>
      </svg>
      Experimentos
    </div>

    <!-- 2) Identificação (dashboard do experimento) -->
    <div class="sidebar-item" data-page="experiment-dashboard">
      <svg viewBox="0 0 24 24">
        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"></path>
      </svg>
      Identificação
    </div>

    <!-- 3) Mapa DBC -->
    <div class="sidebar-item disabled" data-page="dbc-map">
      <svg viewBox="0 0 24 24">
        <path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"></path>
      </svg>
      Mapa DBC
    </div>
  </div>

  <!-- Seção de administração na base -->
  <div class="sidebar-section" style="margin-top: auto;">
    <div class="sidebar-section-title">Administração</div>

    <div class="sidebar-item disabled" data-page="users">
      <svg viewBox="0 0 24 24">
        <path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3
              1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34
              3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3
              3zm0 2c-2.33 0-7 1.17-7 3.5V20h7v-1c0-1.1.9-2 2-2h3.26C14.62
              14.59 11.64 13 8 13zm8 0c-.29 0-.62.02-.97.05C16.21 13.84
              18 15.23 18 17v3h4v-2.5c0-2.33-4.67-3.5-7-3.5z">
        </path>
      </svg>
      Usuários
    </div>

    <div class="sidebar-item disabled" data-page="invites">
      <svg viewBox="0 0 24 24">
        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2
              18c0 1.1.9 2 2 2h16c1.1 0 2-.9
              2-2V6c0-1.1-.9-2-2-2zm-1 10H5v-2h14v2zm0-4H5V8h14v2z">
        </path>
      </svg>
      Convites
    </div>
  </div>
</aside>

  <main class="content-area" id="contentArea">
    <!-- renderizado via JS -->
  </main>
</div>

  <!-- MODAL GENÉRICO -->
  <div id="modalRoot" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"></div>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>
  
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
  <script src="experiments.js"></script>
  <script src="cronograma.js"></script>
