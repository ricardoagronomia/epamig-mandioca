<!DOCTYPE html>
<html>
<head>
    <title>Coletor Voz - MandiocaTrack</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            background: linear-gradient(135deg, #064e3b, #166534);
            height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
        }
        .container { 
            background: white; border-radius: 24px; padding: 32px; max-width: 380px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .title { color: #064e3b; font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .subtitle { color: #6b7280; text-align: center; margin-bottom: 32px; font-size: 16px; }
        #pinInput { 
            display: flex; gap: 12px; justify-content: center; margin-bottom: 24px;
        }
        .pin-box { 
            width: 64px; height: 64px; border: 2px solid #d1d5db; border-radius: 12px; 
            font-size: 24px; text-align: center; font-weight: 600;
        }
        .pin-box:focus { border-color: #166534; outline: none; box-shadow: 0 0 0 3px rgba(22,101,52,0.2); }
        button { 
            width: 100%; padding: 14px; background: linear-gradient(135deg, #166534, #064e3b); 
            color: white; border: none; border-radius: 999px; font-size: 18px; font-weight: 600; cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .qr-preview {
            width: 120px; height: 120px; margin: 20px auto; background: #f3f4f6; 
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🗣️ Coletor Voz</div>
        <div class="subtitle">Digite o PIN da equipe</div>
        
        <div id="pinInput">
            <input class="pin-box" maxlength="1" type="number">
            <input class="pin-box" maxlength="1" type="number">
            <input class="pin-box" maxlength="1" type="number">
            <input class="pin-box" maxlength="1" type="number">
        </div>
        
        <div class="qr-preview" id="qrPreview">
            📱 Escaneie QR Code
        </div>
        
        <button id="collectBtn" disabled>🔴 Parado</button>
    </div>

    <script>
        // 🔐 PIN DA EQUIPE (MUDE AQUI!)
        const PIN_CORRETO = '2512'; // Mude para PIN da sua equipe
        
        const pinInputs = document.querySelectorAll('.pin-box');
        const collectBtn = document.getElementById('collectBtn');
        const qrPreview = document.getElementById('qrPreview');
        let recognition = null;
        let currentParcela = '';
        let currentBloco = '';

        // PIN 4 dígitos
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < 3) {
                    pinInputs[index + 1].focus();
                }
                checkPin();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });
        });

        function checkPin() {
            const pin = Array.from(pinInputs).map(i => i.value).join('');
            if (pin.length === 4) {
                if (pin === PIN_CORRETO) {
                    document.querySelector('.subtitle').textContent = 'PIN correto! Fale agora';
                    collectBtn.disabled = false;
                    collectBtn.textContent = '🟢 Iniciar coleta';
                    pinInputs.forEach(i => i.disabled = true);
                } else {
                    setTimeout(() => {
                        pinInputs.forEach(i => i.value = '');
                        pinInputs[0].focus();
                    }, 500);
                }
            }
        }

        // Reconhecimento de voz
        collectBtn.addEventListener('click', () => {
            if (!recognition) {
                initVoice();
                collectBtn.textContent = '🟡 Escutando...';
            } else {
                stopVoice();
                collectBtn.textContent = '🟢 Iniciar coleta';
            }
        });

        function initVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                
                // Extrai parcela/bloco
                const match = transcript.match(/parcela\s*(\d+).*?bloco\s*(\d+)/i);
                if (match) {
                    currentParcela = match[1];
                    currentBloco = match[2];
                    qrPreview.innerHTML = `📍 P${currentParcela} B${currentBloco}`;
                    
                    // Salva localmente (offline)
                    saveData(currentParcela, currentBloco, transcript);
                }
            };

            recognition.onerror = (event) => {
                console.error('Erro voz:', event.error);
                collectBtn.textContent = '❌ Erro microfone';
                setTimeout(() => {
                    collectBtn.textContent = '🟢 Iniciar coleta';
                }, 2000);
            };

            recognition.onend = () => {
                recognition = null;
                collectBtn.textContent = '🟢 Iniciar coleta';
            };

            recognition.start();
        }

        function stopVoice() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
        }

        function saveData(parcela, bloco, fala) {
            const data = {
                timestamp: new Date().toISOString(),
                parcela: parcela,
                bloco: bloco,
                fala: fala,
                status: 'pendente'
            };
            
            // Salva localStorage (offline)
            let collections = JSON.parse(localStorage.getItem('voiceCollections') || '[]');
            collections.push(data);
            localStorage.setItem('voiceCollections', JSON.stringify(collections));
            
            // Mostra confirmação
            qrPreview.innerHTML = `✅ Salvo! P${parcela} B${bloco}`;
            setTimeout(() => {
                qrPreview.innerHTML = `📱 Escaneie QR Code`;
            }, 1500);
        }

        // PWA offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
