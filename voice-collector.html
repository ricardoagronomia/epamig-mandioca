<!DOCTYPE html>
<html>
<head>
    <title>Coletor Voz - MandiocaTrack</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PWA básico (sem service worker problemático) -->
    <meta name="theme-color" content="#166534">
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkNvbGV0b3IgVm96IE1hbmRpZWNhVHJhY2siLAogICJzaG9ydF9uYW1lIjogIkNvbGV0b3IiLAogICJzdGFydF91cmwiOiAiLyIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzA2NGUzYjIiLAogICJ0aGVtZV9jb2xvciI6ICIjMTY2NTM0IiwKICAiaWNvbnMiOiBbXQp9">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, sans-serif; 
            background: linear-gradient(135deg, #064e3b 0%, #166534 100%);
            min-height: 100vh; padding: 20px;
        }
        .container { 
            background: #fff; border-radius: 24px; padding: 28px; max-width: 420px; 
            margin: 0 auto; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .title { 
            color: #064e3b; font-size: 28px; font-weight: 700; text-align: center; 
            margin-bottom: 12px;
        }
        .subtitle { 
            color: #6b7280; text-align: center; margin-bottom: 28px; font-size: 16px;
        }
        
        /* PIN */
        .pin-row { 
            display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; 
        }
        .pin-box { 
            width: 60px; height: 60px; border: 2px solid #d1d5db; border-radius: 16px; 
            font-size: 24px; text-align: center; font-weight: 700; background: #fafafa;
            transition: all 0.2s;
        }
        .pin-box:focus { 
            border-color: #166534; outline: none; box-shadow: 0 0 0 4px rgba(22,101,52,0.15); 
            background: #fff;
        }
        .pin-box:disabled { opacity: 0.6; }
        
        /* Status */
        .status-box {
            height: 100px; margin: 20px 0; background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-radius: 16px; border: 2px dashed #cbd5e1; display: flex; align-items: center; 
            justify-content: center; font-size: 18px; color: #475569; font-weight: 500; min-height: 80px;
        }
        
        /* Inputs */
        .input-row { display: flex; gap: 16px; margin-bottom: 24px; }
        .input-group { flex: 1; }
        label { 
            display: block; font-size: 13px; color: #374151; margin-bottom: 6px; font-weight: 500;
        }
        input { 
            width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 12px; 
            font-size: 20px; text-align: center; font-weight: 700; transition: all 0.2s;
        }
        input:focus { border-color: #166534; box-shadow: 0 0 0 4px rgba(22,101,52,0.1); }
        
        /* Botões */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        button { 
            padding: 16px 20px; border: none; border-radius: 16px; font-size: 16px; 
            font-weight: 700; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #166534 0%, #064e3b 100%); color: white; 
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #fee2e2; color: #dc2626; }
        .btn-sync { 
            width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); 
            color: white; margin-bottom: 16px;
        }
        
        /* Histórico */
        .history { 
            max-height: 220px; overflow-y: auto; background: #f8fafc; border-radius: 12px; padding: 12px;
        }
        .history-item { 
            display: flex; justify-content: space-between; align-items: center; padding: 10px; 
            background: white; border-radius: 8px; margin-bottom: 8px; font-size: 14px; 
            border-left: 4px solid #10b981;
        }
        
        /* Network */
        .network-status {
            position: fixed; top: 20px; right: 20px; padding: 8px 16px; border-radius: 20px; 
            font-size: 12px; font-weight: 700; z-index: 1000;
        }
        .online { background: #10b981; color: white; }
        .offline { background: #ef4444; color: white; }
        
        /* Mobile */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .container { padding: 20px; border-radius: 20px; }
            .title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- Status Rede -->
    <div class="network-status offline" id="networkStatus">🔴 OFFLINE</div>
    
    <div class="container">
        <div class="title">🌾 Coletor MandiocaTrack</div>
        <div class="subtitle" id="subtitle">Digite PIN da equipe</div>
        
        <!-- PIN 4 dígitos -->
        <div class="pin-row" id="pinRow">
            <input class="pin-box" maxlength="1" type="number" autocomplete="one-time-code">
            <input class="pin-box" maxlength="1" type="number" autocomplete="one-time-code">
            <input class="pin-box" maxlength="1" type="number" autocomplete="one-time-code">
            <input class="pin-box" maxlength="1" type="number" autocomplete="one-time-code">
        </div>
        
        <!-- Formulário coleta -->
        <div id="collectForm" style="display: none;">
            <div class="status-box" id="statusBox">📱 Digite próxima coleta</div>
            
            <div class="input-row">
                <div class="input-group">
                    <label>Parcela</label>
                    <input type="number" id="parcela" placeholder="25">
                </div>
                <div class="input-group">
                    <label>Bloco</label>
                    <input type="number" id="bloco" placeholder="1">
                </div>
            </div>
            
            <div class="btn-grid">
                <button class="btn-primary" id="btnSave">💾 Salvar</button>
                <button class="btn-secondary" id="btnClear">🗑️ Limpar</button>
            </div>
            
            <button class="btn-sync" id="btnSync" style="display: none;">
                📡 Sincronizar <span id="pendingCount">0</span> itens
            </button>
        </div>
        
        <!-- Histórico -->
        <div id="history" class="history" style="display: none;"></div>
    </div>

    <script>
        // 🔐 CONFIGURAÇÃO
        const PIN_EQUIPE = '2512'; // MUDE AQUI!
        
        // Elementos
        const pinBoxes = document.querySelectorAll('.pin-box');
        const collectForm = document.getElementById('collectForm');
        const statusBox = document.getElementById('statusBox');
        const subtitle = document.getElementById('subtitle');
        const btnSave = document.getElementById('btnSave');
        const btnClear = document.getElementById('btnClear');
        const btnSync = document.getElementById('btnSync');
        const historyEl = document.getElementById('history');
        const parcelaInput = document.getElementById('parcela');
        const blocoInput = document.getElementById('bloco');
        const networkStatus = document.getElementById('networkStatus');
        const pendingCount = document.getElementById('pendingCount');
        
        let collections = [];
        
        // === PIN ===
        pinBoxes.forEach((box, i) => {
            box.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && i < 3) pinBoxes[i + 1].focus();
                checkPin();
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) {
                    pinBoxes[i - 1].focus();
                }
            });
        });
        
        function checkPin() {
            const pin = Array.from(pinBoxes).map(b => b.value).join('');
            if (pin.length === 4) {
                if (pin === PIN_EQUIPE) {
                    subtitle.textContent = '✅ PIN correto! Coleta liberada';
                    collectForm.style.display = 'block';
                    pinBoxes.forEach(b => b.disabled = true);
                    parcelaInput.focus();
                    loadCollections();
                } else {
                    setTimeout(() => {
                        pinBoxes.forEach(b => b.value = '');
                        pinBoxes[0].focus();
                    }, 300);
                }
            }
        }
        
        // === COLETA ===
        btnSave.addEventListener('click', saveCollection);
        
        parcelaInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') blocoInput.focus();
        });
        blocoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveCollection();
        });
        
        function saveCollection() {
            const parcela = parcelaInput.value.trim();
            const bloco = blocoInput.value.trim();
            
            if (!parcela || !bloco) {
                statusBox.innerHTML = '❌ Digite Parcela e Bloco';
                setTimeout(() => statusBox.textContent = '📱 Digite próxima coleta', 1500);
                return;
            }
            
            const data = {
                id: Date.now() + Math.random(),
                timestamp: new Date().toISOString(),
                parcela: parcela.padStart(2, '0'),
                bloco: bloco.padStart(2, '0'),
                status: navigator.onLine ? 'sync' : 'pending'
            };
            
            collections.unshift(data);
            localStorage.setItem('voiceCollections', JSON.stringify(collections));
            
            statusBox.innerHTML = `✅ Salvo! P${data.parcela} B${data.bloco}`;
            parcelaInput.value = blocoInput.value = '';
            parcelaInput.focus();
            
            updateUI();
            setTimeout(() => statusBox.textContent = '📱 Digite próxima coleta', 1500);
        }
        
        btnClear.addEventListener('click', () => {
            parcelaInput.value = blocoInput.value = '';
            parcelaInput.focus();
        });
        
        // === LOCAL STORAGE ===
        function loadCollections() {
            try {
                const saved = localStorage.getItem('voiceCollections');
                collections = saved ? JSON.parse(saved) : [];
                updateUI();
            } catch(e) {
                collections = [];
            }
        }
        
        function updateUI() {
            const pending = collections.filter(c => c.status === 'pending');
            
            // Histórico (últimos 8)
            historyEl.innerHTML = collections.slice(0, 8).map(c => `
                <div class="history-item">
                    <span>P${c.parcela} B${c.bloco}</span>
                    <span style="color: ${c.status === 'pending' ? '#f59e0b' : '#10b981'}; font-size: 11px;">
                        ${new Date(c.timestamp).toLocaleString('pt-BR', {timeStyle: 'short'})}
                        ${c.status === 'pending' ? '⏳' : '✅'}
                    </span>
                </div>
            `).join('');
            
            historyEl.style.display = collections.length ? 'block' : 'none';
            pendingCount.textContent = pending.length;
            btnSync.style.display = pending.length ? 'block' : 'none';
        }
        
        // === REDE ===
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        function updateNetworkStatus() {
            const isOnline = navigator.onLine;
            networkStatus.textContent = isOnline ? '🟢 ONLINE' : '🔴 OFFLINE';
            networkStatus.className = `network-status ${isOnline ? 'online' : 'offline'}`;
            
            if (isOnline) trySync();
        }
        
        // === SYNC (placeholder para Supabase) ===
        async function trySync() {
            const pending = collections.filter(c => c.status === 'pending');
            if (!pending.length) return;
            
            statusBox.innerHTML = `📡 Sincronizando ${pending.length} itens...`;
            
            // SIMULA sync com Supabase
            // await supabase.from('collections').insert(pending);
            
            pending.forEach(item => item.status = 'sync');
            localStorage.setItem('voiceCollections', JSON.stringify(collections));
            
            updateUI();
            statusBox.innerHTML = `✅ ${pending.length} itens sincronizados!`;
            setTimeout(() => statusBox.textContent = '📱 Digite próxima coleta', 2000);
        }
        
        btnSync.addEventListener('click', trySync);
        
        // === INIT ===
        updateNetworkStatus();
        loadCollections();
    </script>
</body>
</html>
